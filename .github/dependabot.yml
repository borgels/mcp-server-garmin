version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      # One PR for all non-major updates, so a lock refresh that touches several
      # packages passes the audit in a single run.
      pip-minor-and-patch:
        update-types: [minor, patch]
      pip-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ['*']
